[project]
name = "dao-gan"
version = "1.0.0"
description = "Daoism-Inspired GAN Training Framework"
requires-python = ">=3.11,<3.12"  # 精确锁定小版本，避免 3.12 不兼容

dependencies = [
    "torch==2.3.1+cu121",
    "torchvision==0.18.1+cu121",
    "numpy==1.26.0",
    "pillow==10.4.0",
    "tqdm==4.67.1",
    "tensorboard==2.19.0",
]

[project.optional-dependencies]
dev = ["black", "isort", "pytest"]